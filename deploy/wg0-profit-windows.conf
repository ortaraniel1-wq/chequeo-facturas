# Túnel en la app WireGuard del servidor de Profit (Windows)
[Interface]
Address = 10.8.0.2/32
PrivateKey = <CLAVE_PRIVADA_DEL_SERVIDOR_PROFIT>

[Peer]
# VPS
PublicKey = <CLAVE_PUBLICA_DEL_VPS>
Endpoint = IP_PUBLICA_DEL_VPS:51820
# Solo el VPS: el resto del tráfico del servidor NO pasa por el túnel
AllowedIPs = 10.8.0.1/32
PersistentKeepalive = 25
